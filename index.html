<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Space Flex Mission</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="main-header">

        <h1>🚀 Space Flex Mission</h1>

        <p>
            Learn Flexbox by arranging the planets correctly.
        </p>

    </header>


    <main class="game">

        <section class="game-info">

            <p id="level-counter">
                Level 1 of 6
            </p>

            <h2 id="instruction">
                Center all planets horizontally.
            </h2>

        </section>


        <section
            id="game-board"
            class="game-board"
            aria-label="Flexbox game board"
        >
        </section>


        <section class="controls">

            <div class="control-group">

                <label for="flex-direction">
                    flex-direction
                </label>

                <select id="flex-direction">

                    <option value="row">row</option>
                    <option value="row-reverse">row-reverse</option>
                    <option value="column">column</option>
                    <option value="column-reverse">column-reverse</option>

                </select>

            </div>


            <div class="control-group">

                <label for="justify-content">
                    justify-content
                </label>

                <select id="justify-content">

                    <option value="flex-start">flex-start</option>
                    <option value="center">center</option>
                    <option value="flex-end">flex-end</option>
                    <option value="space-between">space-between</option>
                    <option value="space-around">space-around</option>
                    <option value="space-evenly">space-evenly</option>

                </select>

            </div>


            <div class="control-group">

                <label for="align-items">
                    align-items
                </label>

                <select id="align-items">

                    <option value="stretch">stretch</option>
                    <option value="flex-start">flex-start</option>
                    <option value="center">center</option>
                    <option value="flex-end">flex-end</option>

                </select>

            </div>


            <div class="control-group">

                <label for="flex-wrap">
                    flex-wrap
                </label>

                <select id="flex-wrap">

                    <option value="nowrap">nowrap</option>
                    <option value="wrap">wrap</option>

                </select>

            </div>

        </section>


        <section class="buttons">

            <button id="check-button">
                Check Answer
            </button>

            <button id="reset-button">
                Reset Level
            </button>

            <button id="next-button" disabled>
                Next Level
            </button>

        </section>


        <p
            id="message"
            class="message"
            aria-live="polite"
        ></p>

    </main>


    <footer>

        <p>
            Space Flex Mission · Flexbox Learning Game
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
